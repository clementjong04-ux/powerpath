# Malaysia source registry
# Every assumption cites a source_id from this file. Sources provide EVIDENCE only;
# they are never restated as Powerpath's own official claim. See docs/TRUST_RULES.md.
#
# This file is the source of truth for the Supabase `source_registry` table —
# sync it with `npm run seed:sources` (upsert by id, never deletes).
#
# status values: connected | reference | planned | stubbed
# cadence:     realtime | daily | weekly | monthly | on_demand | manual | none
# parser_type: html | pdf | json_api | csv | manual | none
# priority:    1 = highest
#
# VERIFICATION (added 2026-07-05, verified by Clement):
#   verification_status: verified_official | pending | unverified | not_official_source
#     - only verified_official sources may drive live sync or assumption updates
#     - not_official_source (internal demo) may be displayed but never updates assumptions
#     - pending/unverified show a warning and cannot affect scenario results
#   official_status: free-text description of WHY the source is official (regulator,
#     agency, utility, public API) — or internal_demo.

