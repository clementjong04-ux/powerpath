# Malaysia tariff CATEGORY registry — v0.1 (pre-feasibility references only)
#
# TRUST RULES FOR THIS FILE:
#   * Category references for labeling and study-quality only. NO prices here.
#   * Never used for tariff-grade bill calculation — the engine derives the
#     average unit cost from the user's own bill (annual cost ÷ annual kWh).
#   * legacy_label is historical context only, never active billing vocabulary.
#   * verification_status stays "pending" until a human verifies the category
#     names against the TNB source and flips it in the registry.
#   * Sabah (SESB) and Sarawak (SEB) are deliberately NOT listed: those modules
#     are "coming soon" and must never silently fall back to TNB categories.
#
# Mirrors: supabase/migrations/0008_tariff_registry.sql (DB seed) and
# src/lib/tariffs.ts (code fallback). If you change one, change all three.

